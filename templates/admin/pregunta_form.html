{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white"><h5>{{ titulo }}</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Texto</label>
                        <textarea name="texto" class="form-control" rows="3" required>{{ pregunta.texto if pregunta else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label>Instrucciones</label>
                        <textarea name="instrucciones" class="form-control" rows="2">{{ pregunta.instrucciones if pregunta else '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label>Nivel</label>
                            <select name="nivel_id" class="form-select">
                                {% for nivel in niveles %}
                                <option value="{{ nivel.id }}" {% if pregunta and pregunta.nivel_id==nivel.id %}selected{% endif %}>{{ nivel.codigo }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Categoría</label>
                            <select name="categoria_id" class="form-select">
                                {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if pregunta and pregunta.categoria_id==cat.id %}selected{% endif %}>{{ cat.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label>Dificultad (1-5)</label>
                            <input type="number" name="dificultad" class="form-control" min="1" max="5" value="{{ pregunta.dificultad if pregunta else 1 }}">
                        </div>
                        <div class="col-md-6 mt-4">
                            <input type="checkbox" name="activa" {% if not pregunta or pregunta.activa %}checked{% endif %}> Activa
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="{{ url_for('admin_preguntas') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
