{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header bg-secondary text-white"><h5><i class="fas fa-tag"></i> Niveles MCER</h5></div>
    <div class="card-body">
        <table class="table">
            <thead><tr><th>Código</th><th>Nombre</th></tr></thead>
            <tbody>
                {% for nivel in niveles %}
                <tr><td><span class="badge bg-primary">{{ nivel.codigo }}</span></td><td>{{ nivel.nombre }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
